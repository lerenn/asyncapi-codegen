asyncapi: 2.5.0
info:
  title: Issue 290 - allOf schema references in message payloads
  version: 1.0.0

channels:
  test.created:
    subscribe:
      message:
        payload:
          $ref: '#/components/schemas/TestEvent'

components:
  schemas:
    TestEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            data:
              type: string

    BaseEvent:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
