asyncapi: 3.0.0
info:
  title: Multi-member oneOf payload
  version: 1.0.0
channels:
  test:
    address: v3.issue258.test
    messages:
      testMessage:
        $ref: '#/components/messages/testMessage'
operations:
  testOperation:
    action: send
    channel:
      $ref: '#/channels/test'
    messages:
      - $ref: '#/channels/test/messages/testMessage'
components:
  messages:
    testMessage:
      payload:
        oneOf:
          - $ref: '#/components/schemas/intValue'
          - $ref: '#/components/schemas/strValue'
  schemas:
    intValue:
      type: object
      properties:
        value:
          type: integer
    strValue:
      type: object
      properties:
        value:
          type: string
