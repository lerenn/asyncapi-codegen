asyncapi: 3.0.0

info:
  title: Issue 138 - default values
  version: 1.0.0

components:
  schemas:
    Settings:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        retries:
          type: integer
          default: 3
        ratio:
          type: number
          format: float
          default: 1.5
        enabled:
          type: boolean
          default: true
        label:
          type: string
          default: hello world
