asyncapi: 3.0.0
info:
  title: Enum values
  version: 1.0.0

channels:
  lights:
    address: lights
    messages:
      lightsMessage:
        $ref: '#/components/messages/lightsMessage'

operations:
  receiveLights:
    action: receive
    channel:
      $ref: '#/channels/lights'

components:
  messages:
    lightsMessage:
      payload:
        $ref: '#/components/schemas/Foo'
  schemas:
    Color:
      type: string
      enum: [red, amber, green]
    Foo:
      type: object
      properties:
        color:
          $ref: '#/components/schemas/Color'
        inline:
          type: string
          enum: ["on", "off", "not-available"]
        inlineDefault:
          type: string
          enum: [low, high]
          default: low
        list:
          type: array
          items:
            type: string
            enum: [a, b]
